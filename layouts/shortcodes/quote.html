<div style="margin: 1.5rem 0; padding: 0.75rem 1rem; border-left: 3px solid #ccc;">
  <p style="font-size: 1.05rem; font-style: italic; margin: 0 0 0.4rem 0; line-height: 1.45;">
    “{{ .Inner }}”
  </p>

  {{ with .Get "author" }}
    <p style="text-align: right; margin: 0; font-size: 0.9rem; opacity: 0.7;">
      — {{ . }}
    </p>
  {{ end }}
</div>
